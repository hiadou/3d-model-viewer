<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>民族带穗琉璃珠串六叉刻花骨簪 - 展陈版</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: url('./Background.png') center / cover no-repeat;
        }
        canvas { position: relative; z-index: 1; display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s;
            max-width: calc(100vw - 80px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 640px) {
            #info {
                font-size: 11px;
                padding: 6px 12px;
                top: 10px;
                max-width: calc(100vw - 60px);
            }
            #autoRotateHint {
                font-size: 11px;
                padding: 6px 14px;
                bottom: 20px;
            }
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 18px;
            background: rgba(255,255,255,0.9);
            padding: 20px 30px;
            border-radius: 10px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: opacity 0.4s;
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-size: 16px;
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 10px;
            display: none;
            z-index: 30;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        #autoRotateHint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10;
            cursor: pointer;
            transition: background 0.3s, opacity 0.5s;
            user-select: none;
        }
        #autoRotateHint:hover {
            background: rgba(0,0,0,0.8);
        }
        #fullscreenBtn {
            position: absolute;
            top: 16px; right: 16px;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s;
            user-select: none;
            border: none;
            outline: none;
            line-height: 1;
        }
        #fullscreenBtn:hover { background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="bg"></div>
    <div id="info">民族带穗琉璃珠串六叉刻花骨簪 3D模型 - 拖拽旋转 / 滚轮缩放</div>
    <div id="fullscreenBtn" title="全屏">⛶</div>
    <div id="loading">⏳ 加载模型中...</div>
    <div id="error">❌ 模型加载失败<br/><span style="font-size:12px;">请确保 six-pronged.glb 文件在同一目录下</span></div>
    <div id="autoRotateHint">▶ 自动旋转中 (点击切换)</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.target.set(0, 0, 0);

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffcc88, 0.5);
        backLight.position.set(-5, 0, -5);
        scene.add(backLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 0.4);
        fillLight.position.set(-3, 2, 5);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444466, 0.5);
        scene.add(hemiLight);

        // --- 音频 ---
        const audio = new Audio('./background.mp3');
        audio.loop = true;
        audio.volume = 0.5;

        function tryAutoPlayMusic() {
            audio.play().catch(() => {
                const firstClickHandler = () => {
                    audio.play().catch(e => console.warn('音频播放失败', e));
                    renderer.domElement.removeEventListener('click', firstClickHandler);
                    hintEl.removeEventListener('click', firstClickHandler);
                    console.log('💡 用户首次交互后音乐启动');
                };
                renderer.domElement.addEventListener('click', firstClickHandler);
                hintEl.addEventListener('click', firstClickHandler);
            });
        }

        // --- 加载模型 ---
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const hintEl = document.getElementById('autoRotateHint');

        function updateAutoRotateHint() {
            hintEl.textContent = controls.autoRotate
                ? '▶ 自动旋转中 (点击切换)'
                : '⏸ 已暂停 (点击切换)';
        }

        loader.load(
            './six-pronged.glb',
            function (gltf) {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);

                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 5) {
                    model.scale.multiplyScalar(5 / maxDim);
                } else if (maxDim > 0 && maxDim < 1) {
                    model.scale.multiplyScalar(1 / maxDim);
                }

                scene.add(model);
                dracoLoader.dispose();

                loadingEl.style.opacity = '0';
                setTimeout(() => { loadingEl.style.display = 'none'; }, 400);

                updateAutoRotateHint();
                tryAutoPlayMusic();

                console.log('✅ six-pronged.glb 加载成功');
            },
            function (xhr) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loadingEl.textContent = `⏳ 加载中... ${percent}%`;
            },
            function (error) {
                console.error('❌ 加载失败:', error);
                loadingEl.style.opacity = '0';
                setTimeout(() => {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                }, 400);
            }
        );

        // --- 窗口自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 点击切换自动旋转 ---
        function toggleAutoRotate() {
            controls.autoRotate = !controls.autoRotate;
            updateAutoRotateHint();
        }

        renderer.domElement.addEventListener('click', toggleAutoRotate);
        hintEl.addEventListener('click', toggleAutoRotate);

        // --- 全屏切换 ---
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const el = document.documentElement;
                (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
        }

        function updateFullscreenIcon() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            fullscreenBtn.textContent = isFull ? '✕' : '⛶';
            fullscreenBtn.title = isFull ? '退出全屏' : '全屏';
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        console.log('💡 点击画面即可切换自动旋转，背景音乐将持续播放');
    </script>
</body>
</html>
